[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtmpack-harness"
version = "0.1.0"
description = "Benchmark harness for the RTM Pattern Pack (Spark Real-Time Mode vs Apache Flink)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.6",
    "numpy>=1.26",
    "boto3>=1.34",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rtmpack = "rtmpack_harness.cli:main"

[tool.setuptools.packages.find]
include = ["rtmpack_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
